name: Build & Push Multi-Arch Docker Image

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) ดึงโค้ดจาก repo
      - name: Checkout source
        uses: actions/checkout@v4

      # 2) เปิด QEMU เพื่อ build image ข้ามสถาปัตยกรรม (amd64 / arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # 3) เปิด Docker Buildx (จำเป็นสำหรับ multi-arch)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 4) Login เข้า GitHub Container Registry (GHCR)
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 5) Build + Push image (amd64 + arm64)
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/DevPhotchara/vitrafit:latest
          platforms: linux/amd64,linux/arm64
